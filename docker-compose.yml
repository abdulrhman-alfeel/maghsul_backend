services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - "${PORT:-8080}:8080"
    # يسمح للحاوية بالوصول لقاعدة البيانات المثبتة مباشرة على السيرفر (خارج Docker)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "npx prisma migrate deploy && npx prisma generate && npm start"
    depends_on:
      redis:
        condition: service_started
    restart: always

  redis:
    image: redis:7-alpine
    restart: always
