name: Deploy to Server

on:
  push:
    branches:
      - main # Change this if your default branch is 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. الذهاب لمجلد المشروع في السيرفر
            cd ${{ secrets.DEPLOY_DIR }}

            # 2. سحب التحديثات إجبارياً لتفادي أي تعارض (Merge Conflict) في السيرفر
            git fetch --all
            git reset --hard origin/main

            # 3. بناء وتحديث جميع الحاويات التي حصل تغيير في إعداداتها (مثل ملف docker-compose)
            docker-compose up -d --build

            # 4. تنظيف الصور القديمة لتوفير المساحة
            docker image prune -f
